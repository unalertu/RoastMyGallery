# XcodeGen spec — run `xcodegen generate` to (re)create RoastMyGallery.xcodeproj.
# Install with: brew install xcodegen
name: RoastMyGallery
options:
  bundleIdPrefix: com.ertugrul # → com.ertugrul.RoastMyGallery (matches App Store Connect, Apple ID 6791121107)
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Swift Package dependencies. `from: 5.0.0` resolves to the latest RevenueCat
# 5.x, which includes the Virtual Currencies API (Purchases.virtualCurrencies(),
# cachedVirtualCurrencies, invalidateVirtualCurrenciesCache()). Run
# `xcodegen generate` after changing this, then let Xcode/SPM resolve the package.
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

targets:
  RoastMyGallery:
    type: application
    platform: iOS
    sources:
      - RoastMyGallery
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    # Ship guard: a Release build refuses to proceed while any DEBUG-only
    # code marked "STRIP BEFORE SHIPPING" is still in the source tree.
    # Runs before Compile Sources (fail-fast); Debug builds skip instantly.
    # Gated on CONFIGURATION=Release rather than "only when installing"
    # because Archive always builds Release, but a plain Release build does
    # not "install" — this way both are covered.
    preBuildScripts:
      - name: "Ship Guard — no STRIP BEFORE SHIPPING in Release"
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            echo "Ship-guard: skipped (${CONFIGURATION:-manual} build)."
            exit 0
          fi
          MARKER="STRIP BEFORE SHIPPING"
          # Scoped to the app source tree only — never .git, backend,
          # DerivedData, or generated/worktree directories.
          MATCHES=$(grep -rn --include="*.swift" "${MARKER}" "${SRCROOT}/RoastMyGallery" || true)
          if [ -z "${MATCHES}" ]; then
            echo "Ship-guard: no '${MARKER}' markers found — OK to ship."
            exit 0
          fi
          echo "error: DEBUG-only code marked '${MARKER}' is still present in a Release build:"
          echo "${MATCHES}" | while IFS= read -r line; do
            file="${line%%:*}"
            rest="${line#*:}"
            lineno="${rest%%:*}"
            # path:line: error: … renders as a clickable red error in Xcode.
            echo "${file}:${lineno}: error: remove this '${MARKER}' code before shipping"
          done
          exit 1
    info:
      path: RoastMyGallery/Info.plist
      properties:
        CFBundleDisplayName: Roast My Gallery
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: >-
          Roast My Gallery analyzes your photos entirely on this device to
          find patterns worth roasting. Your photos never leave your phone
          unless you explicitly choose Deep Analysis.
        # Add-only access, used solely when the user taps "Save Image" on a
        # share card from the system share sheet.
        NSPhotoLibraryAddUsageDescription: >-
          Roast My Gallery saves the share cards you create to your photo
          library when you choose to save them.
        # Standard HTTPS only — no exempt encryption (answers the App Store
        # Connect export-compliance question automatically).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground # cream, matches Theme.Colors.background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for now
        # MARKETING_VERSION must match the version App Store Connect shows for
        # the release ("1.0" on a first submission); bump CURRENT_PROJECT_VERSION
        # for every new archive uploaded to the SAME marketing version.
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        DEVELOPMENT_TEAM: J7L764Z34L

# Explicit scheme so the Run action loads the local StoreKit Configuration
# file. Without this, RevenueCat can only fetch products from App Store Connect
# (which needs the Paid Apps Agreement signed + products "Ready to Submit" +
# propagation) and offerings come back empty. Pointing Run at
# RoastMyGallery.storekit lets the paywall populate from the local products
# (credits_pack_10 / credits_pack_40 / credits_pack_120) during development.
# NOTE: local StoreKit purchases do NOT trigger RevenueCat's server-side
# Virtual Currency grant — the gem balance won't rise from a simulated buy.
# Full gem-grant verification still requires real App Store sandbox.
schemes:
  RoastMyGallery:
    build:
      targets:
        RoastMyGallery: all
    run:
      config: Debug
      storeKitConfiguration: RoastMyGallery.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

# TODO once you have a real backend: add a Config/*.xcconfig per environment
# holding BACKEND_BASE_URL (never API keys — those live server-side only).
