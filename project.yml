# XcodeGen spec — run `xcodegen generate` to (re)create RoastMyGallery.xcodeproj.
# Install with: brew install xcodegen
name: RoastMyGallery
options:
  bundleIdPrefix: com.example # TODO: your real bundle ID prefix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  RoastMyGallery:
    type: application
    platform: iOS
    sources:
      - RoastMyGallery
    info:
      path: RoastMyGallery/Info.plist
      properties:
        CFBundleDisplayName: Roast My Gallery
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: >-
          Roast My Gallery analyzes your photos entirely on this device to
          find patterns worth roasting. Your photos never leave your phone
          unless you explicitly choose Deep Analysis.
        UILaunchScreen:
          UIColorName: LaunchBackground # cream, matches Theme.Colors.background
        # Dev-only: lets the simulator reach `vercel dev` on http://localhost.
        # Production traffic is HTTPS; remove this if you stop using localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for now
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        # TODO: set DEVELOPMENT_TEAM to your Apple Developer team ID

# TODO once you have a real backend: add a Config/*.xcconfig per environment
# holding BACKEND_BASE_URL (never API keys — those live server-side only).
